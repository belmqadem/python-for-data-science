[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ft_package"
version = "0.0.1"
description = "A utility package providing a custom slugify function"
authors = [
    { name = "belmqadem", email = "adilfront3@gmail.com" },
]
readme = "README.md"
license = "MIT"
requires-python = ">=3.8"

classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]