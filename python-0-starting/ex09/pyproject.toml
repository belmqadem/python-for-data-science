[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ft_package"
version = "0.0.1"
summary = "A sample test package"
authors = [
    { name="belmqadem", email="adilfront3@gmail.com" },
]
description = "A utility package providing a custom slugify function"
readme = "README.md"
License = "MIT"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]